
name: Add FixTrack Logo and Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: unzip -o FixTrack-Starter-Project.zip -d .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: pip install Pillow

      - name: Generate launcher icons
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("fixtrack-starter/app/src/main")
          logo_path = Path("file_000000007e688211904e5b6ca18b37ea.png")

          if not logo_path.exists():
              raise SystemExit("Logo PNG not found in repository root")

          logo = Image.open(logo_path).convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          for density, size in sizes.items():
              folder = root / "res" / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = ImageOps.fit(
                  logo, (size, size),
                  method=Image.Resampling.LANCZOS
              )
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          manifest = root / "AndroidManifest.xml"
          text = manifest.read_text()

          if 'android:icon=' not in text:
              text = text.replace(
                  '<application',
                  '<application\n        android:icon="@mipmap/ic_launcher"',
                  1
              )

          if 'android:roundIcon=' not in text:
              text = text.replace(
                  '<application',
                  '<application\n        android:roundIcon="@mipmap/ic_launcher_round"',
                  1
              )

          manifest.write_text(text)
          print("Launcher icons created and manifest updated.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Build debug APK
        run: gradle --no-daemon -p fixtrack-starter assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FixTrack-logo-debug-apk
          path: fixtrack-starter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
